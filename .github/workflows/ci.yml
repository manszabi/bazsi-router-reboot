
# Host tesztek, fuzzing és a valódi ESP32-C3 fordítás minden pushra.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Viselkedés (IDF 6 + 5), ASan/UBSan, lefedettség, lint, figyelmeztetések, verem.
  host-tests:
    name: Host tesztek (IDF 6 + IDF 5, ASan/UBSan, lefedettseg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fordito es gcov verzio
        run: g++ --version && gcov --version | head -1

      - name: make lint
        working-directory: test
        run: make lint

      - name: make warn
        working-directory: test
        run: make warn

      - name: make stack
        working-directory: test
        run: make stack

      - name: make test
        working-directory: test
        run: make test

      - name: make san
        working-directory: test
        run: make san

      - name: make covgate
        working-directory: test
        run: make covgate

  # Időre fut: 40 mp célpontonként.
  fuzz:
    name: Fuzzing (libFuzzer, negy bemenet-elemzo celpont)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: A clang sanitizer/fuzzer futtatokornyezete
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends clang libclang-rt-dev

      - name: make fuzz
        working-directory: test
        run: FUZZSEC=40 make fuzz

  # Valódi fordítás pinelt core- és könyvtárverziókkal; a partícióba férés is.
  firmware-build:
    name: ESP32-C3 firmware forditas (XIAO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-arduino-cli@v2

      - name: ESP32 core telepitese (4.0.0)
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@4.0.0

      - name: Konyvtarak telepitese (pinelt verziok)
        run: |
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli lib install --git-url https://github.com/ESP32Async/AsyncTCP.git#v3.6.1
          arduino-cli lib install --git-url https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.12.1
          arduino-cli lib install ESPping@1.0.5

      - name: A sketch mappa osszeallitasa
        run: |
          mkdir -p sketchdir/bazsi_router_reboot
          cp bazsi_router_reboot.ino sketchdir/bazsi_router_reboot/
          cp *.h *.cpp sketchdir/bazsi_router_reboot/
          cp partitions_custom.csv sketchdir/bazsi_router_reboot/partitions.csv
          echo "A lefordulo forrasok:"
          ls -1 sketchdir/bazsi_router_reboot/

      - name: Forditas
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:XIAO_ESP32C3 \
            --warnings all \
            sketchdir/bazsi_router_reboot

      - name: A stubok igazolasa a valodi konyvtarak ellen
        working-directory: test
        run: STUBROOTS="$HOME/.arduino15 $HOME/Arduino/libraries" make stubcheck
