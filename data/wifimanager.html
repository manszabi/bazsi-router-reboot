<!DOCTYPE html>
<html>
<head>
  <title>ESP Wi-Fi Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <div class="topnav">
    <h1>ESP Wi-Fi Manager</h1>
  </div>
  <div class="content">
    <div class="card-grid">
      <div class="card">
        <form action="/" method="POST">
          <p>
            <label for="ssid">SSID</label>
            <input type="text" id="ssid" name="ssid" maxlength="32" required><br>
            <label for="pass">Password</label>
            <input type="password" id="pass" name="pass" maxlength="63"><br>
            <label for="ip">IP Address</label>
            <input type="text" id="ip" name="ip" maxlength="15" placeholder="192.168.1.200 (opcionális)"><br>
            <label for="gateway">Gateway Address</label>
            <input type="text" id="gateway" name="gateway" maxlength="15" placeholder="192.168.1.1 (opcionális)"><br>
            <small>Statikus IP-hez <b>mindkét</b> címmezőt töltsd ki, csak IPv4.
            DHCP-hez hagyd üresen mindkettőt.</small><br>
            <input type="submit" value="Submit">
          </p>
        </form>
        <p><a href="/log">Diagnosztikai napló</a></p>
      </div>
    </div>
  </div>
</body>
</html>
